<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="748" viewBox="0 0 1160 748" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1160" height="748" fill="#FFFFFF"/>

  <!-- ================= 1. CAN 接线 ================= -->
  <text x="40" y="62" font-size="20" font-weight="bold" fill="#0F172A">1. CAN 接线：模块 ↔ 飞控</text>

  <!-- 飞控 -->
  <rect x="70" y="110" width="230" height="210" rx="12" fill="#EEF3FB" stroke="#4A78C2" stroke-width="2"/>
  <text x="185" y="152" font-size="22" font-weight="bold" fill="#1E3A8A" text-anchor="middle">飞控</text>
  <text x="185" y="180" font-size="13" fill="#475569" text-anchor="middle">ArduPilot / PX4</text>

  <!-- 飞控 CAN 接口（4Pin） -->
  <rect x="300" y="165" width="32" height="110" rx="5" fill="#C9D6EA" stroke="#4A78C2" stroke-width="1.5"/>
  <rect x="305" y="167" width="22" height="10" fill="#8FA6C8"/>
  <rect x="305" y="197" width="22" height="10" fill="#8FA6C8"/>
  <rect x="305" y="227" width="22" height="10" fill="#8FA6C8"/>
  <rect x="305" y="257" width="22" height="10" fill="#8FA6C8"/>
  <text x="316" y="156" font-size="12" fill="#4A78C2" text-anchor="middle">CAN 接口</text>

  <!-- A2 空速模块 -->
  <rect x="880" y="105" width="240" height="220" rx="12" fill="#2B2F36" stroke="#0F172A" stroke-width="2"/>
  <text x="1000" y="152" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A2 空速模块</text>
  <text x="1000" y="180" font-size="13" fill="#94A3B8" text-anchor="middle">GH1.25 4Pin</text>

  <!-- 模块 CAN 接口 -->
  <rect x="850" y="165" width="30" height="110" rx="5" fill="#E7DCC6" stroke="#8A7A5E" stroke-width="1.5"/>
  <rect x="853" y="167" width="22" height="10" fill="#C9BFA4"/>
  <rect x="853" y="197" width="22" height="10" fill="#C9BFA4"/>
  <rect x="853" y="227" width="22" height="10" fill="#C9BFA4"/>
  <rect x="853" y="257" width="22" height="10" fill="#C9BFA4"/>

  <!-- 四根线：自上而下 GND / CAN_L / CAN_H / 5V+ -->
  <circle cx="332" cy="172" r="3.5" fill="#334155"/><circle cx="850" cy="172" r="3.5" fill="#334155"/>
  <line x1="332" y1="172" x2="850" y2="172" stroke="#334155" stroke-width="3"/>
  <text x="590" y="164" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">GND</text>

  <circle cx="332" cy="202" r="3.5" fill="#16A34A"/><circle cx="850" cy="202" r="3.5" fill="#16A34A"/>
  <line x1="332" y1="202" x2="850" y2="202" stroke="#16A34A" stroke-width="3"/>
  <text x="590" y="194" font-size="13" font-weight="bold" fill="#15803D" text-anchor="middle">CAN_L</text>

  <circle cx="332" cy="232" r="3.5" fill="#D97706"/><circle cx="850" cy="232" r="3.5" fill="#D97706"/>
  <line x1="332" y1="232" x2="850" y2="232" stroke="#D97706" stroke-width="3"/>
  <text x="590" y="224" font-size="13" font-weight="bold" fill="#B45309" text-anchor="middle">CAN_H</text>

  <circle cx="332" cy="262" r="3.5" fill="#DC2626"/><circle cx="850" cy="262" r="3.5" fill="#DC2626"/>
  <line x1="332" y1="262" x2="850" y2="262" stroke="#DC2626" stroke-width="3"/>
  <text x="590" y="254" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">5V+（VCC）</text>

  <!-- 模块侧引脚标注 -->
  <text x="890" y="177" font-size="11.5" fill="#94A3B8">GND</text>
  <text x="890" y="207" font-size="11.5" fill="#94A3B8">CAN_L</text>
  <text x="890" y="237" font-size="11.5" fill="#94A3B8">CAN_H</text>
  <text x="890" y="267" font-size="11.5" fill="#94A3B8">5V+</text>

  <text x="590" y="308" font-size="13.5" fill="#475569" text-anchor="middle">配套 CAN 连接线（4Pin）</text>

  <text x="40" y="350" font-size="12.5" fill="#64748B">· 模块 CAN 接口引脚顺序自上而下为 GND、CAN_L、CAN_H、5V+，实物以模块丝印及配套 CAN 线为准</text>
  <text x="40" y="374" font-size="12.5" fill="#64748B">· 飞控侧 CAN 接口的针位排列以飞控丝印为准，两侧按信号一一对应连接（GND→GND、CAN_L→CAN_L、CAN_H→CAN_H、5V+→VCC）</text>
  <text x="40" y="398" font-size="12.5" fill="#64748B">· 5V+（VCC）、GND 不可反接；CAN_H、CAN_L 不可接反；图中线缆颜色仅为示意</text>

  <line x1="40" y1="424" x2="1120" y2="424" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ================= 2. 气路连接 ================= -->
  <text x="40" y="462" font-size="20" font-weight="bold" fill="#0F172A">2. 气路连接：皮托管 ↔ 模块</text>

  <!-- 皮托管 -->
  <rect x="90" y="555" width="230" height="26" rx="13" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <text x="205" y="618" font-size="14.5" fill="#1E293B" text-anchor="middle">皮托管</text>

  <!-- 静压口 + 管路 -->
  <circle cx="150" cy="553" r="4.5" fill="#0F172A"/>
  <text x="162" y="534" font-size="12.5" fill="#2F6FB0">静压口</text>
  <path d="M150,553 V492 H812" fill="none" stroke="#2F6FB0" stroke-width="3"/>
  <text x="560" y="480" font-size="13" fill="#475569" text-anchor="middle">硅胶管</text>

  <!-- 总压口 + 管路 -->
  <circle cx="322" cy="568" r="4.5" fill="#0F172A"/>
  <text x="334" y="558" font-size="12.5" fill="#B91C1C">总压口</text>
  <path d="M322,568 H812" fill="none" stroke="#B91C1C" stroke-width="3"/>
  <text x="560" y="556" font-size="13" fill="#475569" text-anchor="middle">硅胶管</text>

  <!-- 模块差压接口 -->
  <rect x="830" y="440" width="290" height="190" rx="12" fill="#2B2F36" stroke="#0F172A" stroke-width="2"/>
  <text x="975" y="478" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A2 空速模块</text>
  <text x="975" y="500" font-size="12.5" fill="#94A3B8" text-anchor="middle">差压接口</text>

  <rect x="812" y="486" width="18" height="12" rx="2" fill="#E7DCC6" stroke="#8A7A5E" stroke-width="1.5"/>
  <text x="846" y="497" font-size="13" fill="#E2E8F0">P2（静压）</text>

  <rect x="812" y="562" width="18" height="12" rx="2" fill="#E7DCC6" stroke="#8A7A5E" stroke-width="1.5"/>
  <text x="846" y="573" font-size="13" fill="#E2E8F0">P1（动压）</text>

  <text x="975" y="658" font-size="12" fill="#64748B" text-anchor="middle">P1 / P2 上下位置与丝印以实物为准</text>

  <text x="40" y="698" font-size="12.5" fill="#64748B">· 硅胶管与皮托管、模块接口须连接密封、不可漏气；气管不可接反</text>
  <text x="40" y="722" font-size="12.5" fill="#64748B">· P2（静压）可接皮托管静压口，也可直接与环境静压连通；总压孔、静压孔须保持通畅</text>
</svg>
